openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8090
  description: Generated server url
paths:
  /api/users:
    get:
      tags:
      - users
      summary: List all team members (admin only)
      operationId: list
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserDto"
    post:
      tags:
      - users
      summary: Create a team member (admin only)
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserDto"
  /api/stall-reasons:
    get:
      tags:
      - catalogs
      summary: List stall reasons
      operationId: listStallReasons
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogDto"
    post:
      tags:
      - catalogs
      summary: Create stall reason (admin)
      operationId: createStallReason
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCatalogRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CatalogDto"
  /api/notifications/{id}/read:
    post:
      tags:
      - notifications
      summary: Mark one notification as read
      operationId: markRead
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
  /api/notifications/read-all:
    post:
      tags:
      - notifications
      summary: Mark all my notifications as read
      operationId: markAllRead
      responses:
        "204":
          description: No Content
  /api/me/password:
    post:
      tags:
      - users
      summary: Change own password
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
        required: true
      responses:
        "200":
          description: OK
  /api/leads:
    get:
      tags:
      - leads
      summary: Search/filter leads (marketing sees own; admins see all)
      operationId: list_1
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - LEAD
          - HOT_LEAD
          - APPLICATION
          - STUDENT
          - STALLED
      - name: countryCode
        in: query
        required: false
        schema:
          type: string
      - name: courseId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: channelId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: assignedTo
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: createdFrom
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: createdTo
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 25
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LeadPageDto"
    post:
      tags:
      - leads
      summary: Create a lead (owner defaults to the caller; admins may assign)
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeadRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LeadDto"
  /api/leads/{id}/transition:
    post:
      tags:
      - leads
      summary: Move a lead through the funnel; every accepted move writes an immutable
        event
      operationId: transition
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LeadDto"
  /api/leads/{id}/activities:
    get:
      tags:
      - activities
      summary: Activities of a lead (ownership enforced)
      operationId: list_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityDto"
    post:
      tags:
      - activities
      summary: Log an activity; contact kinds reset the lead's SLA clock
      operationId: add
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateActivityRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ActivityDto"
  /api/courses:
    get:
      tags:
      - catalogs
      summary: List courses
      operationId: listCourses
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogDto"
    post:
      tags:
      - catalogs
      summary: Create course (admin)
      operationId: createCourse
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCatalogRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CatalogDto"
  /api/channels:
    get:
      tags:
      - catalogs
      summary: List channels
      operationId: listChannels
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogDto"
    post:
      tags:
      - catalogs
      summary: Create channel (admin)
      operationId: createChannel
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCatalogRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CatalogDto"
  /api/auth/reset-password:
    post:
      tags:
      - auth
      summary: Set a new password using a reset token; revokes all existing sessions
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
        required: true
      responses:
        "204":
          description: No Content
  /api/auth/refresh:
    post:
      tags:
      - auth
      summary: Exchange a refresh token for a new token pair (old one is revoked)
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/auth/login:
    post:
      tags:
      - auth
      summary: "Authenticate with email/password, returns JWT access + rotating refresh\
        \ token"
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/auth/forgot-password:
    post:
      tags:
      - auth
      summary: "Request a password reset link by email (always succeeds, never reveals\
        \ if the email exists)"
      operationId: forgotPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
        required: true
      responses:
        "204":
          description: No Content
  /api/activities/{id}/complete:
    post:
      tags:
      - activities
      summary: Mark a follow-up as done
      operationId: complete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ActivityDto"
  /api/users/{id}:
    patch:
      tags:
      - users
      summary: "Update name, role or active flag (admin only; users are deactivated,\
        \ never deleted)"
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserDto"
  /api/stall-reasons/{id}:
    patch:
      tags:
      - catalogs
      summary: Rename or (de)activate stall reason (admin)
      operationId: updateStallReason
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCatalogRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CatalogDto"
  /api/leads/{id}:
    get:
      tags:
      - leads
      summary: Lead detail with full status history
      operationId: detail
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LeadDetailDto"
    patch:
      tags:
      - leads
      summary: Update lead data; reassignment is admin-only and audited
      operationId: update_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLeadRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LeadDto"
  /api/courses/{id}:
    patch:
      tags:
      - catalogs
      summary: Rename or (de)activate course (admin)
      operationId: updateCourse
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCatalogRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CatalogDto"
  /api/channels/{id}:
    patch:
      tags:
      - catalogs
      summary: Rename or (de)activate channel (admin)
      operationId: updateChannel
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCatalogRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CatalogDto"
  /api/ping:
    get:
      tags:
      - ping
      summary: Health ping used to validate the generated API clients
      operationId: ping
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PingResponse"
  /api/notifications:
    get:
      tags:
      - notifications
      summary: My recent notifications (newest first)
      operationId: recent
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationDto"
  /api/notifications/unread-count:
    get:
      tags:
      - notifications
      summary: Count of my unread notifications
      operationId: unreadCount
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UnreadCountDto"
  /api/my/follow-ups:
    get:
      tags:
      - activities
      summary: "My open follow-ups, ordered by due date"
      operationId: myFollowUps
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FollowUpDto"
  /api/me:
    get:
      tags:
      - users
      summary: Current authenticated user
      operationId: me
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserDto"
  /api/leads/duplicates:
    get:
      tags:
      - leads
      summary: "Possible duplicates by email/phone — warn, don't block (RN-04)"
      operationId: duplicates
      parameters:
      - name: email
        in: query
        required: false
        schema:
          type: string
      - name: phone
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DuplicateDto"
  /api/analytics/timeseries:
    get:
      tags:
      - analytics
      summary: Leads created vs converted over time
      operationId: timeseries
      parameters:
      - name: interval
        in: query
        required: false
        schema:
          type: string
          default: week
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimePoint"
  /api/analytics/summary:
    get:
      tags:
      - analytics
      summary: Headline KPIs
      operationId: summary
      parameters:
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Summary"
  /api/analytics/leaderboard:
    get:
      tags:
      - analytics
      summary: Team leaderboard (admin only)
      operationId: leaderboard
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardRow"
  /api/analytics/funnel:
    get:
      tags:
      - analytics
      summary: Conversion funnel — distinct leads that ever reached each stage
      operationId: funnel
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FunnelStage"
  /api/analytics/drop-off:
    get:
      tags:
      - analytics
      summary: Drop-off — where and why leads stalled
      operationId: dropOff
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DropOffRow"
  /api/analytics/by-course:
    get:
      tags:
      - analytics
      summary: Volume and conversion by course
      operationId: byCourse
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BreakdownRow"
  /api/analytics/by-country:
    get:
      tags:
      - analytics
      summary: Volume and conversion by country of origin
      operationId: byCountry
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CountryRow"
  /api/analytics/by-channel:
    get:
      tags:
      - analytics
      summary: Volume and conversion by channel
      operationId: byChannel
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BreakdownRow"
components:
  schemas:
    CreateUserRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          maxLength: 2147483647
          minLength: 8
        role:
          type: string
          enum:
          - ADMINISTRATOR
          - MARKETING_TEAM
      required:
      - email
      - name
      - password
      - role
    UserDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
          - ADMINISTRATOR
          - MARKETING_TEAM
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
    CreateCatalogRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
      required:
      - name
    CatalogDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        active:
          type: boolean
    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          maxLength: 2147483647
          minLength: 8
      required:
      - currentPassword
      - newPassword
    CreateLeadRequest:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
        countryCode:
          type: string
          minLength: 1
          pattern: "[A-Za-z]{2}"
        email:
          type: string
        phone:
          type: string
        courseId:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        assignedTo:
          type: string
          format: uuid
        utmSource:
          type: string
        utmMedium:
          type: string
        utmCampaign:
          type: string
      required:
      - channelId
      - countryCode
      - courseId
      - fullName
    LeadDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        countryCode:
          type: string
        email:
          type: string
        phone:
          type: string
        courseId:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        utmSource:
          type: string
        utmMedium:
          type: string
        utmCampaign:
          type: string
        status:
          type: string
          enum:
          - LEAD
          - HOT_LEAD
          - APPLICATION
          - STUDENT
          - STALLED
        stalledFromStatus:
          type: string
          enum:
          - LEAD
          - HOT_LEAD
          - APPLICATION
          - STUDENT
          - STALLED
        stallReasonId:
          type: string
          format: uuid
        assignedTo:
          type: string
          format: uuid
        assignedToName:
          type: string
        lastContactedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    TransitionRequest:
      type: object
      properties:
        toStatus:
          type: string
          enum:
          - LEAD
          - HOT_LEAD
          - APPLICATION
          - STUDENT
          - STALLED
        stallReasonId:
          type: string
          format: uuid
        note:
          type: string
      required:
      - toStatus
    CreateActivityRequest:
      type: object
      properties:
        type:
          type: string
          enum:
          - NOTE
          - CALL
          - EMAIL
          - WHATSAPP
          - MEETING
          - FOLLOW_UP
        content:
          type: string
          minLength: 1
        dueAt:
          type: string
          format: date-time
      required:
      - content
      - type
    ActivityDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        leadId:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - NOTE
          - CALL
          - EMAIL
          - WHATSAPP
          - MEETING
          - FOLLOW_UP
        content:
          type: string
        dueAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
        createdByName:
          type: string
        createdAt:
          type: string
          format: date-time
    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
        newPassword:
          type: string
          maxLength: 2147483647
          minLength: 8
      required:
      - newPassword
      - token
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 1
      required:
      - refreshToken
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: "#/components/schemas/UserDto"
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - email
      - password
    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
          enum:
          - ADMINISTRATOR
          - MARKETING_TEAM
        active:
          type: boolean
    UpdateCatalogRequest:
      type: object
      properties:
        name:
          type: string
        active:
          type: boolean
    UpdateLeadRequest:
      type: object
      properties:
        fullName:
          type: string
        countryCode:
          type: string
          pattern: "[A-Za-z]{2}"
        email:
          type: string
        phone:
          type: string
        courseId:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        assignedTo:
          type: string
          format: uuid
    PingResponse:
      type: object
      properties:
        service:
          type: string
        status:
          type: string
        serverTime:
          type: string
          format: date-time
    NotificationDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - SLA_BREACH
          - FOLLOW_UP_DUE
        leadId:
          type: string
          format: uuid
