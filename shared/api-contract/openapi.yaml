openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8090
  description: Generated server url
paths:
  /api/users:
    get:
      tags:
      - users
      summary: List all team members (admin only)
      operationId: list
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserDto"
    post:
      tags:
      - users
      summary: Create a team member (admin only)
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserDto"
  /api/me/password:
    post:
      tags:
      - users
      summary: Change own password
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
        required: true
      responses:
        "200":
          description: OK
  /api/auth/refresh:
    post:
      tags:
      - auth
      summary: Exchange a refresh token for a new token pair (old one is revoked)
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/auth/login:
    post:
      tags:
      - auth
      summary: "Authenticate with email/password, returns JWT access + rotating refresh\
        \ token"
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/users/{id}:
    patch:
      tags:
      - users
      summary: "Update name, role or active flag (admin only; users are deactivated,\
        \ never deleted)"
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserDto"
  /api/ping:
    get:
      tags:
      - ping
      summary: Health ping used to validate the generated API clients
      operationId: ping
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PingResponse"
  /api/me:
    get:
      tags:
      - users
      summary: Current authenticated user
      operationId: me
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserDto"
components:
  schemas:
    CreateUserRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          maxLength: 2147483647
          minLength: 8
        role:
          type: string
          enum:
          - ADMINISTRATOR
          - MARKETING_TEAM
      required:
      - email
      - name
      - password
      - role
    UserDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
          - ADMINISTRATOR
          - MARKETING_TEAM
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          maxLength: 2147483647
          minLength: 8
      required:
      - currentPassword
      - newPassword
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 1
      required:
      - refreshToken
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: "#/components/schemas/UserDto"
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - email
      - password
    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
          enum:
          - ADMINISTRATOR
          - MARKETING_TEAM
        active:
          type: boolean
    PingResponse:
      type: object
      properties:
        service:
          type: string
        status:
          type: string
        serverTime:
          type: string
          format: date-time
