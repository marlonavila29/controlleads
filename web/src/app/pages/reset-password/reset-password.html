<div class="login">
  <form class="card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Choose a new password</h1>
    <p class="subtitle">Set a new password for your account.</p>

    <label>
      <span>New password</span>
      <input type="password" formControlName="newPassword" placeholder="At least 8 characters" autocomplete="new-password" />
    </label>
    <label>
      <span>Confirm password</span>
      <input type="password" formControlName="confirm" placeholder="Repeat the password" autocomplete="new-password" />
    </label>

    @if (error(); as message) {
      <p class="error">{{ message }}</p>
    }

    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Saving…' : 'Reset password' }}
    </button>
    <a routerLink="/login" class="link-back">‹ Back to sign in</a>
  </form>
</div>
