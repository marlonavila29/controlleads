server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # DNS resolver for external proxy pass
    resolver 1.1.1.1 8.8.8.8 valid=30s;

    # Proxy /api/ requests to the live Dokploy backend
    location /api/ {
        proxy_pass https://controlleads-back.comcode.com.br/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host controlleads-back.comcode.com.br;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
