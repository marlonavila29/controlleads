name: CD — Build & Deploy Web (Produção)

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Build and Push Web
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}

      - name: Build and push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/controlleads-web:latest
            ghcr.io/${{ github.repository_owner }}/controlleads-web:${{ github.sha }}

      - name: Trigger Dokploy Deploy
        run: |
          if [ ! -z "${{ secrets.DOKPLOY_WEBHOOK_WEB_URL }}" ]; then
            curl -fsSL -X POST "${{ secrets.DOKPLOY_WEBHOOK_WEB_URL }}"
          else
            echo "DOKPLOY_WEBHOOK_WEB_URL is not set. Skipping automatic deployment trigger."
          fi

      - name: Limpar imagens antigas do GHCR
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'controlleads-web'
          package-type: 'container'
          min-versions-to-keep: 10
          delete-only-untagged-versions: false
          token: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}
        continue-on-error: true
