name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    # No postgres service needed — tests spin their own via Testcontainers.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build & test
        working-directory: backend
        run: ./mvnw -B verify

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Tokens up to date
        run: node shared/design-tokens/build.mjs && git diff --exit-code web/src/styles/_tokens.scss
      - name: Build
        working-directory: web
        run: npm run build
      - name: Test
        working-directory: web
        run: npm test -- --watch=false

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Analyze
        working-directory: app
        run: flutter pub get && flutter analyze
      - name: Test
        working-directory: app
        run: flutter test
