name: CD — Build & Deploy Backend (Produção)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'shared/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Push Backend
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}

      - name: Build and push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/controlleads-backend:latest
            ghcr.io/${{ github.repository_owner }}/controlleads-backend:${{ github.sha }}

      - name: Trigger Dokploy Deploy
        run: |
          if [ ! -z "${{ secrets.DOKPLOY_WEBHOOK_BACKEND_URL }}" ]; then
            curl -fsSL -X POST "${{ secrets.DOKPLOY_WEBHOOK_BACKEND_URL }}"
          else
            echo "DOKPLOY_WEBHOOK_BACKEND_URL is not set. Skipping automatic deployment trigger."
          fi

      - name: Limpar imagens antigas do GHCR
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'controlleads-backend'
          package-type: 'container'
          min-versions-to-keep: 10
          delete-only-untagged-versions: false
          token: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}
        continue-on-error: true
