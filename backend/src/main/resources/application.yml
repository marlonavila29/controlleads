spring:
  application:
    name: controlleads
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:controlleads}
    username: ${DB_USER:controlleads}
    password: ${DB_PASSWORD:controlleads}
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema
    open-in-view: false
  flyway:
    enabled: true

app:
  security:
    jwt:
      # Base64-encoded HS256 key. Dev default only — set APP_SECURITY_JWT_SECRET in prod.
      secret: ${APP_SECURITY_JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uISE=}
      access-ttl: 15m
      refresh-ttl: 14d

springdoc:
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

server:
  port: 8090   # non-default — 8080/8081 already taken by other local services
